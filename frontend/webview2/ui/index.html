<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>OBS Studio</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header><nav id="menus" aria-label="OBS menus" data-i18n-aria-label="WebView2.Menus"></nav><button id="original" class="subtle" title="Open the original OBS window" data-i18n-title="WebView2.MainWindow.Tooltip" data-i18n="WebView2.MainWindow">Original OBS window</button></header>
  <div id="error" role="alert" hidden><span></span><button aria-label="Dismiss notification" data-i18n-aria-label="WebView2.CloseNotification">×</button></div>
  <main>
    <section class="preview-area" aria-label="Preview and program" data-i18n-aria-label="WebView2.PreviewAndProgram">
      <div id="preview-trim-left" class="preview-trim-handle" role="separator" aria-label="Left preview margin" data-i18n-aria-label="WebView2.PreviewTrimLeft" aria-orientation="vertical" tabindex="0"></div>
      <div class="preview-column"><div class="preview-title"><span id="scene-title">OBS Studio</span><span id="preview-mode"></span></div><div id="preview-grid"><div id="preview" class="canvas"><div id="preview-disabled" hidden><button id="enable-preview" data-i18n="Basic.Main.PreviewConextMenu.Enable">Enable Preview</button></div></div><div id="preview-scroll-y" class="preview-scroll" tabindex="0" aria-label="Scroll preview vertically" data-i18n-aria-label="WebView2.PreviewScrollVertical"><div></div></div><div id="preview-scroll-x" class="preview-scroll" tabindex="0" aria-label="Scroll preview horizontally" data-i18n-aria-label="WebView2.PreviewScrollHorizontal"><div></div></div></div></div>
      <div id="studio-controls" hidden><button id="studio-transition" data-i18n="Transition">Transition</button><div id="quick-transitions"></div><label for="tbar" data-i18n="WebView2.ManualTransition">Manual transition</label><input id="tbar" type="range" min="0" max="1023" value="0" aria-label="Manual transition" data-i18n-aria-label="WebView2.ManualTransition"><button id="studio-config" class="subtle" data-i18n="WebView2.TransitionSettings">Transition settings</button></div>
      <div id="program-column" class="preview-column" hidden><div class="preview-title"><span data-i18n="StudioMode.Program">Program</span><span id="program-title"></span></div><div id="program" class="canvas"></div></div>
      <div id="preview-trim-right" class="preview-trim-handle" role="separator" aria-label="Right preview margin" data-i18n-aria-label="WebView2.PreviewTrimRight" aria-orientation="vertical" tabindex="0"></div>
    </section>
    <div id="context-bar"><span id="selected-name" data-i18n="ContextBar.NoSelectedSource">No source selected</span><button id="properties" disabled data-i18n="Properties">Properties</button><button id="filters" disabled data-i18n="Filters">Filters</button><button id="source-tools" hidden data-i18n="Basic.MainMenu.View.ContextBar">Source Toolbar</button><button id="interact" hidden data-i18n="Interact">Interact</button><span class="spacer"></span><button id="zoom-out" class="icon-button" title="Zoom Out" data-i18n-title="Basic.MainMenu.Edit.Scale.ZoomOut">−</button><span id="preview-percent"></span><select id="preview-scaling" aria-label="Preview scaling" data-i18n-aria-label="WebView2.PreviewScaling"></select><button id="zoom-in" class="icon-button" title="Zoom In" data-i18n-title="Basic.MainMenu.Edit.Scale.ZoomIn">+</button></div>
    <div id="panel-resizer" role="separator" aria-label="Panel height" data-i18n-aria-label="WebView2.PanelHeight" tabindex="0" aria-orientation="horizontal"></div>
    <div class="panels" id="panels">
      <section class="panel" data-panel="scenesDock"><h2 id="scenes-title" data-i18n="Basic.Main.Scenes">Scenes</h2><div id="scenes" class="rows" role="listbox" aria-labelledby="scenes-title"></div><div id="scene-toolbar" class="toolbar" role="toolbar" aria-label="Scene tools" data-i18n-aria-label="WebView2.SceneTools"></div></section>
      <section class="panel" data-panel="sourcesDock"><h2 id="sources-title" data-i18n="Basic.Main.Sources">Sources</h2><div id="sources" class="rows" role="listbox" aria-multiselectable="true" aria-labelledby="sources-title"></div><div id="source-toolbar" class="toolbar" role="toolbar" aria-label="Source tools" data-i18n-aria-label="WebView2.SourceTools"></div></section>
      <section class="panel" data-panel="mixerDock"><h2 id="mixer-title" data-i18n="Mixer">Audio Mixer</h2><div id="mixer"></div><div class="toolbar"><button id="advanced-audio" title="Advanced Audio Properties" data-i18n-title="Basic.AdvAudio">⚙</button><button id="mixer-menu" title="Mixer options" data-i18n-title="Basic.AudioMixer.Options">⋮</button><span class="toolbar-caption" data-i18n="WebView2.Audio">Audio</span></div></section>
      <section class="panel" data-panel="transitionsDock"><h2 id="transitions-title" data-i18n="Basic.SceneTransitions">Scene Transitions</h2><div class="transition-settings"><select id="transition-type" aria-label="Scene transition" data-i18n-aria-label="Basic.SceneTransitions"></select><label id="transition-duration-label"><span data-i18n="Basic.TransitionDuration">Duration</span> <span><input id="transition-duration" type="number" min="50" max="20000" step="50" value="300" aria-label="Transition duration" data-i18n-aria-label="Basic.TransitionDuration"> <span data-i18n="WebView2.Milliseconds">ms</span></span></label><div id="transition-toolbar" class="toolbar"></div></div></section>
      <section class="panel controls-panel" data-panel="controlsDock"><h2 id="controls-title" data-i18n="Basic.Main.Controls">Controls</h2><div id="controls"></div></section>
    </div>
  </main>
  <div id="context-menu" class="context-menu" hidden></div>
  <dialog id="rename-dialog"><form method="dialog"><h2 id="rename-title" data-i18n="Rename">Rename</h2><input id="rename-value" maxlength="170" required autocomplete="off"><div class="dialog-buttons"><button value="cancel" formnovalidate data-i18n="Cancel">Cancel</button><button value="ok" class="primary" data-i18n="OK">OK</button></div></form></dialog>
  <footer><span id="connection" role="status" data-i18n="WebView2.Connecting">Connecting to OBS…</span><span id="output-status"></span><span id="status"></span></footer>
</body>
</html>
